# Codecov configuration for h2kvm
# Documentation: https://docs.codecov.com/docs/codecov-yaml

coverage:
  precision: 2
  round: down
  range: 70...100

  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: false

    patch:
      default:
        target: 80%
        threshold: 5%
        informational: true

  ignore:
    - "tests/**"
    - "setup.py"
    - "**/__main__.py"

comment:
  layout: "reach,diff,flags,tree,footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

flags:
  unittests:
    paths:
      - h2kvm/
    carryforward: true

github_checks:
  annotations: true
