# Mypy configuration - Based on systemd project strict type checking
# https://mypy.readthedocs.io/en/stable/config_file.html

[mypy]
# Python version compatibility
python_version = 3.9

# Output configuration
pretty = True
show_error_codes = True
show_column_numbers = True
show_error_context = True
color_output = True

# Strict mode (enabled incrementally)
# Full strict mode: uncomment when ready
# strict = True

# Individual strict mode components (enable gradually)
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = False  # Too strict initially, enable later
warn_unreachable = True

# Type checking strictness (gradually enable)
disallow_any_generics = False  # Enable in phase 2
disallow_subclassing_any = False  # Enable in phase 2
disallow_untyped_calls = False  # Enable in phase 2
disallow_untyped_defs = False  # Enable in phase 2 (start with new code)
disallow_incomplete_defs = False  # Enable in phase 2
check_untyped_defs = True  # Already enabled
disallow_untyped_decorators = False  # Enable in phase 2

# None and Optional handling
no_implicit_optional = True
strict_optional = True

# Error messages
show_traceback = True

# Import discovery
namespace_packages = True
ignore_missing_imports = False  # Prefer explicit ignores per module

# Incremental checking
incremental = True
cache_dir = .mypy_cache

# Platform
platform = linux

# Per-module configuration
# ========================

# Third-party libraries without type stubs
[mypy-libvirt.*]
ignore_missing_imports = True

[mypy-guestfs.*]
ignore_missing_imports = True

[mypy-hivex.*]
ignore_missing_imports = True

[mypy-augeas.*]
ignore_missing_imports = True

[mypy-parted.*]
ignore_missing_imports = True

[mypy-gi.*]
ignore_missing_imports = True

[mypy-rpm.*]
ignore_missing_imports = True

[mypy-winreg.*]
ignore_missing_imports = True

[mypy-docker.*]
ignore_missing_imports = True

[mypy-kubernetes.*]
ignore_missing_imports = True

[mypy-ansible.*]
ignore_missing_imports = True

[mypy-textual.*]
ignore_missing_imports = True

[mypy-rich.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True

[mypy-setuptools.*]
ignore_missing_imports = True

# VMware libraries
[mypy-pyVmomi.*]
ignore_missing_imports = True

[mypy-pyVim.*]
ignore_missing_imports = True

# Azure libraries
[mypy-azure.*]
ignore_missing_imports = True

[mypy-msrest.*]
ignore_missing_imports = True

# AWS libraries
[mypy-boto3.*]
ignore_missing_imports = True

[mypy-botocore.*]
ignore_missing_imports = True

# Other dependencies
[mypy-lxml.*]
ignore_missing_imports = True

[mypy-jinja2.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-toml.*]
ignore_missing_imports = True

[mypy-libvirt_qemu.*]
ignore_missing_imports = True

[mypy-cryptography.*]
ignore_missing_imports = True

# Test modules (relaxed rules)
[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_decorators = False
check_untyped_defs = False

# Legacy modules (gradually migrate)
[mypy-hyper2kvm.fixers.*]
warn_return_any = False
disallow_untyped_defs = False

[mypy-hyper2kvm.converters.*]
warn_return_any = False
disallow_untyped_defs = False

[mypy-hyper2kvm.providers.vmware.*]
warn_return_any = False
disallow_untyped_defs = False

# Strict typing for new/refactored modules
[mypy-hyper2kvm.vmcraft.block_device]
warn_return_any = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True

[mypy-hyper2kvm.vmcraft.storage]
warn_return_any = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True

[mypy-hyper2kvm.luks.*]
warn_return_any = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True

[mypy-hyper2kvm.pipeline.*]
warn_return_any = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True

# Core modules (enable strict checking)
[mypy-hyper2kvm.core.exceptions]
warn_return_any = True
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-hyper2kvm.core.retry]
warn_return_any = True
disallow_untyped_defs = True
disallow_incomplete_defs = True

# Gradual migration plan:
# Phase 1 (Week 1): New modules only (vmcraft.block_device, luks, pipeline)
# Phase 2 (Week 2-3): Core modules (exceptions, retry, utils)
# Phase 3 (Month 2): Converters and providers
# Phase 4 (Month 3): Fixers and remaining modules
# Phase 5 (Month 4): Enable global strict = True
