# Ruff configuration - Based on systemd project practices
# https://docs.astral.sh/ruff/

# Python version compatibility
target-version = "py39"

# Line length - matching systemd's 109 character limit
line-length = 109

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
    "*.egg-info",
]

[lint]
# Enable rule sets
select = [
    "E",     # pycodestyle errors
    "F",     # Pyflakes
    "I",     # isort (import sorting)
    "UP",    # pyupgrade (modernize Python code)
    "B",     # flake8-bugbear (likely bugs and design problems)
    "SIM",   # flake8-simplify (simplification suggestions)
    "C90",   # mccabe (cyclomatic complexity)
    "N",     # pep8-naming
    "W",     # pycodestyle warnings
    "YTT",   # flake8-2020 (misuse of sys.version)
    "ASYNC", # flake8-async (async/await issues)
    "S",     # flake8-bandit (security issues)
    "BLE",   # flake8-blind-except (blind except)
    "A",     # flake8-builtins (shadowing builtins)
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez (datetime without timezone)
    "T10",   # flake8-debugger (debugger statements)
    "EXE",   # flake8-executable (executable permissions)
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "PIE",   # flake8-pie (misc lints)
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise (unnecessary exception raising)
    "RET",   # flake8-return (return statement issues)
    "SLOT",  # flake8-slots (define __slots__)
    "SIM",   # flake8-simplify
    "TID",   # flake8-tidy-imports
    "TCH",   # flake8-type-checking (type checking imports)
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib (use pathlib instead of os.path)
    "PD",    # pandas-vet
    "PGH",   # pygrep-hooks
    "PL",    # Pylint
    "TRY",   # tryceratops (exception handling)
    "FLY",   # flynt (f-string conversion)
    "PERF",  # Perflint (performance anti-patterns)
    "RUF",   # Ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",    # Line too long (handled by formatter)
    "S101",    # Use of assert (common in tests)
    "S603",    # subprocess without shell=True (we use it safely)
    "S607",    # Starting a process with a partial path (expected for system commands)
    "PLR0913", # Too many arguments (we use config objects where needed)
    "PLR0912", # Too many branches (some complex functions are necessary)
    "PLR0915", # Too many statements (some functions are legitimately long)
    "TRY003",  # Avoid specifying long messages in exception (we want descriptive errors)
    "TRY301",  # Abstract raise to inner function (not always applicable)
    "COM812",  # Missing trailing comma (conflicts with formatter)
    "ISC001",  # Implicit string concatenation (conflicts with formatter)

    # Overzealous rules - disabled after manual review
    "BLE001",  # Blind except - often necessary for robustness in VM manipulation
    "PLR2004", # Magic value comparison - many values are self-documenting (100.0 for %, 60 for seconds)
    "TRY300",  # Try-consider-else - not always clearer
    "TRY401",  # Verbose log message - lazy % formatting not compatible with f-strings
    "PLC0415", # Import outside top-level - sometimes needed for lazy imports or circular deps
    "PGH003",  # Blanket type ignore - sometimes unavoidable with third-party libraries
    "PLW2901", # Loop variable overwritten - sometimes intentional for value transformation
    "TID252",  # Relative imports - acceptable within a package (72 occurrences, all internal)

    # Code organization preferences - disabled for existing codebase
    "S110",    # Try-except-pass - 315 occurrences, many are intentional (optional operations)
    "E402",    # Module import not at top - 98 occurrences, often for lazy imports
    "ARG002",  # Unused method argument - 119 occurrences, interface/override methods
    "ARG001",  # Unused function argument - 42 occurrences, callback signatures
    "PTH123",  # Use pathlib - 90 occurrences, open() is fine for simple cases
    "PTH110",  # Use pathlib exists - 29 occurrences, os.path is fine
    "PTH108",  # Use pathlib unlink - 22 occurrences, os.unlink is fine
    "PTH118",  # Use pathlib join - 9 occurrences, os.path.join is fine
    "PTH101",  # Use pathlib chmod - 10 occurrences, os.chmod is fine
    "PTH105",  # Use pathlib replace - 10 occurrences, os.replace is fine
    "PTH120",  # Use pathlib dirname - 5 occurrences, os.path.dirname is fine

    # Performance micro-optimizations - not critical
    "PERF203", # Try-except in loop - 114 occurrences, usually necessary
    "PERF401", # Manual list comprehension - 82 occurrences, often more readable

    # Complexity metrics - already addressed worst offenders
    "C901",    # Complex structure - 90 occurrences, cyclomatic complexity handled by mccabe
    "PLR0911", # Too many return statements - 51 occurrences, sometimes necessary

    # Security false positives
    "S108",    # Hardcoded temp file - 47 occurrences, using /tmp is standard
    "S112",    # Try-except-continue - 39 occurrences, intentional error skipping
    "S104",    # Hardcoded bind all interfaces - 8 occurrences, intentional for services
    "S105",    # Hardcoded password string - 7 occurrences, test data and examples
    "S311",    # Non-cryptographic random - 7 occurrences, not for security purposes
    "S314",    # XML ElementTree - 5 occurrences, parsing trusted XML

    # Style preferences
    "SIM102",  # Collapsible if - 29 occurrences, often clearer when separate
    "SIM105",  # Suppressible exception - 23 occurrences, explicit is clearer
    "RUF012",  # Mutable class default - 83 occurrences, dataclasses handle this correctly
    "PLW0603", # Global statement - 16 occurrences, sometimes necessary for state

    # Datetime without timezone - often intentional for local time
    "DTZ005",  # datetime.now without tz - 84 occurrences
    "DTZ006",  # datetime.fromtimestamp - 7 occurrences
    "DTZ003",  # datetime.utcnow - 6 occurrences

    # Naming conventions - existing code follows different conventions
    "N801",    # Invalid class name - 29 occurrences, some use SCREAMING_SNAKE for constants classes
    "N806",    # Non-lowercase variable in function - 5 occurrences, sometimes capitals needed
    "N818",    # Error suffix on exception name - 5 occurrences, not all exceptions need Error suffix

    # Unicode and ambiguity - false positives
    "RUF001",  # Ambiguous unicode char string - 11 occurrences, intentional non-ASCII
    "RUF003",  # Ambiguous unicode char comment - 10 occurrences, intentional non-ASCII
    "E741",    # Ambiguous variable name - 4 occurrences, short names are fine in context
]

# Per-file ignores
[lint.per-file-ignores]
"tests/*" = [
    "S101",    # Assert statements are expected in tests
    "ARG001",  # Unused function arguments (fixtures)
    "PLR2004", # Magic values in comparisons (test data)
    "S105",    # Hardcoded passwords (test data)
    "S106",    # Hardcoded passwords (test data)
]
"**/test_*.py" = [
    "S101",
    "ARG001",
    "PLR2004",
]

[lint.mccabe]
# Cyclomatic complexity threshold
# Warn on functions with complexity > 15
max-complexity = 15

[lint.isort]
# Import sorting configuration
known-first-party = ["hyper2kvm"]
combine-as-imports = true
force-wrap-aliases = true
split-on-trailing-comma = true

# Section ordering
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder"
]

[lint.flake8-builtins]
# Allow shadowing of specific builtins
builtins-ignorelist = ["id", "type", "format", "input", "filter", "map"]

[lint.flake8-quotes]
# Prefer double quotes (Python convention)
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"

[lint.pylint]
# Pylint-specific settings
max-args = 5
max-branches = 15
max-returns = 6
max-statements = 50

[format]
# Code formatting settings
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# Respect existing magic trailing commas
skip-magic-trailing-comma = false

# Quote preferences
docstring-code-format = true
docstring-code-line-length = 88
