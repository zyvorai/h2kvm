apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: h2kvm-worker
  namespace: h2kvm-workers
  labels:
    app: h2kvm-worker
    component: worker-daemon
spec:
  selector:
    matchLabels:
      app: h2kvm-worker
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: h2kvm-worker
        component: worker-daemon
    spec:
      # Node selection for worker-capable nodes
      nodeSelector:
        h2kvm.io/worker-enabled: "true"
      
      tolerations:
      - key: h2kvm.io/privileged
        operator: Exists
        effect: NoSchedule
      
      # Service account for worker operations
      serviceAccountName: h2kvm-worker
      
      # Host networking for NBD device access
      hostNetwork: false
      hostPID: false
      
      # Init container: Load NBD kernel module
      initContainers:
      - name: nbd-module-loader
        image: fedora:43
        command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "Loading NBD kernel module..."
          if lsmod | grep -q nbd; then
            echo "NBD module already loaded"
          else
            modprobe nbd max_part=16 nbds_max=16
            echo "NBD module loaded successfully"
          fi
          lsmod | grep nbd
        securityContext:
          privileged: true
        volumeMounts:
        - name: lib-modules
          mountPath: /lib/modules
          readOnly: true
        - name: sys
          mountPath: /sys
      
      containers:
      - name: worker
        image: h2kvm:latest
        imagePullPolicy: IfNotPresent
        
        env:
        - name: H2KVM_MODE
          value: "worker"
        - name: WORKER_ID
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: H2KVM_STATE_DIR
          value: "/var/lib/h2kvm/jobs"
        - name: H2KVM_EVENT_DIR
          value: "/var/lib/h2kvm/events"
        - name: H2KVM_QUEUE_DIR
          value: "/var/lib/h2kvm/queue"
        - name: PYTHONUNBUFFERED
          value: "1"
        
        command:
        - /usr/local/bin/docker-entrypoint.sh
        
        # Privileged mode required for NBD, LVM, mount operations
        securityContext:
          privileged: true
          capabilities:
            add:
            - SYS_ADMIN
            - MKNOD
            - SYS_CHROOT
        
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "8"
            memory: "16Gi"
        
        volumeMounts:
        # Configuration
        - name: config
          mountPath: /etc/h2kvm
          readOnly: true
        
        # Worker state and events
        - name: worker-state
          mountPath: /var/lib/h2kvm
        
        # Device access
        - name: dev
          mountPath: /dev
          mountPropagation: Bidirectional
        
        # Input/output storage
        - name: incoming-storage
          mountPath: /data/incoming
        - name: output-storage
          mountPath: /data/output
        
        # Kernel modules for NBD
        - name: lib-modules
          mountPath: /lib/modules
          readOnly: true
        
        # Lifecycle hooks for graceful shutdown
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - "kill -TERM $(cat /var/lib/h2kvm/worker.pid 2>/dev/null) 2>/dev/null; sleep 30"

        # Liveness probe: Check worker process
        livenessProbe:
          exec:
            command:
            - python3
            - -c
            - |
              import sys
              import os
              pid_file = '/var/lib/h2kvm/worker.pid'
              if os.path.exists(pid_file):
                sys.exit(0)
              sys.exit(1)
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Readiness probe: Check capability detection
        readinessProbe:
          exec:
            command:
            - python3
            - -m
            - h2kvm.worker.cli
            - capabilities
            - --json-output
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 10
      
      # Graceful shutdown with long grace period for in-progress migrations
      terminationGracePeriodSeconds: 7200
      
      volumes:
      - name: config
        configMap:
          name: h2kvm-worker-config
      
      - name: worker-state
        hostPath:
          path: /var/lib/h2kvm
          type: DirectoryOrCreate
      
      - name: dev
        hostPath:
          path: /dev
          type: Directory
      
      - name: lib-modules
        hostPath:
          path: /lib/modules
          type: Directory
      
      - name: sys
        hostPath:
          path: /sys
          type: Directory
      
      - name: incoming-storage
        hostPath:
          path: /mnt/h2kvm/incoming
          type: DirectoryOrCreate
      
      - name: output-storage
        hostPath:
          path: /mnt/h2kvm/output
          type: DirectoryOrCreate
