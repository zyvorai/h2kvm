apiVersion: v1
kind: ServiceAccount
metadata:
  name: h2kvm-worker
  namespace: h2kvm-workers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: h2kvm-worker
  namespace: h2kvm-workers
rules:
# Allow workers to read ConfigMaps for job specs
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]

# Allow workers to update their own status
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "patch"]

# Allow workers to create events
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]

# Allow workers to read secrets for credentials
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: h2kvm-worker
  namespace: h2kvm-workers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: h2kvm-worker
subjects:
- kind: ServiceAccount
  name: h2kvm-worker
  namespace: h2kvm-workers
