# Example Ingress for hyper2kvm worker API
# Requires an Ingress controller (e.g., nginx, traefik)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hyper2kvm-api
  namespace: hyper2kvm-workers
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50g"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: hyper2kvm.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: hyper2kvm-worker
                port:
                  number: 8080
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: hyper2kvm-worker
                port:
                  number: 9090
