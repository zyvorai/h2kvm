# CentOS 9 End-to-End Test MigrationJob
# Tests complete migration workflow for CentOS 9 VMDK to QCOW2

apiVersion: h2kvm.io/v1alpha1
kind: MigrationJob
metadata:
  name: centos9-e2e-test
  namespace: h2kvm-test
  labels:
    app: h2kvm
    test: e2e
    os: centos9
    distro: centos-stream
spec:
  # Operation type: convert VMDK to QCOW2
  operation: convert

  # Source image specification
  image:
    path: /data/input/centos9.vmdk
    format: vmdk

  # Operation parameters - CentOS 9 specific configuration
  parameters:
    # Output configuration
    output_format: qcow2
    compress: true
    compression_type: zstd

    # Filesystem fixes
    fstab_mode: stabilize-all
    fstab_prefer_partuuid: false
    fstab_optimize_options: true

    # Boot fixes
    grub_fixes: true
    regen_initramfs: true
    initramfs_force: true

    # VirtIO drivers for CentOS 9
    initramfs_modules:
      - virtio_blk
      - virtio_scsi
      - virtio_net
      - virtio_pci
      - virtio_ring
      - virtio

    # Network configuration
    network_fixes: true
    network_config:
      mode: dhcp

    # VM configuration
    vm_name: centos9-e2e-vm
    memory_mb: 4096
    vcpus: 2
    disk_bus: virtio
    net_model: virtio

    # Graphics
    graphics: vnc
    graphics_listen: "0.0.0.0"
    video: qxl

    # Reporting
    report_format: markdown
    verbose: 2

  # Output artifacts
  artifacts:
    output_path: /data/output/centos9-e2e
    output_format: qcow2
    compress: true

  # Job priority (higher for E2E test)
  priority: 80

  # Timeout for job execution
  timeout: 2h

  # Retry policy
  retryPolicy:
    maxRetries: 3
    backoff: exponential

  # Worker selection
  workerSelector:
    h2kvm.io/worker-enabled: "true"
