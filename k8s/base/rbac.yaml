---
# ServiceAccount for h2kvm pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: h2kvm
  namespace: vm-migration
  labels:
    app.kubernetes.io/name: h2kvm
    app.kubernetes.io/part-of: h2kvm

---
# ClusterRole for privileged h2kvm operations
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: h2kvm:privileged
rules:
  # Allow use of privileged PSP
  - apiGroups: ['policy']
    resources: ['podsecuritypolicies']
    verbs: ['use']
    resourceNames:
      - h2kvm-privileged

---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: h2kvm:privileged
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: h2kvm:privileged
subjects:
  - kind: ServiceAccount
    name: h2kvm
    namespace: vm-migration
