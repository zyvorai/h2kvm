apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../worker
  - ../../monitoring

# Production overrides: larger resources, stricter policies
patches:
  - target:
      kind: DaemonSet
      name: hyper2kvm-worker
    patch: |
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: hyper2kvm-worker
      spec:
        template:
          spec:
            containers:
              - name: hyper2kvm-worker
                resources:
                  requests:
                    cpu: "4"
                    memory: "8Gi"
                  limits:
                    cpu: "16"
                    memory: "32Gi"

  - target:
      kind: HorizontalPodAutoscaler
      name: hyper2kvm-worker-hpa
    patch: |
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: hyper2kvm-worker-hpa
      spec:
        minReplicas: 3
        maxReplicas: 50

  - target:
      kind: PodDisruptionBudget
      name: hyper2kvm-worker-pdb
    patch: |
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: hyper2kvm-worker-pdb
      spec:
        minAvailable: 2

commonLabels:
  environment: production
