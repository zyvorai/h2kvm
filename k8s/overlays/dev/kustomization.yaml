apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../worker

# Dev overrides: smaller resources, single replica
patches:
  - target:
      kind: DaemonSet
      name: hyper2kvm-worker
    patch: |
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: hyper2kvm-worker
      spec:
        template:
          spec:
            containers:
              - name: hyper2kvm-worker
                resources:
                  requests:
                    cpu: "500m"
                    memory: "1Gi"
                  limits:
                    cpu: "2"
                    memory: "4Gi"

  - target:
      kind: HorizontalPodAutoscaler
      name: hyper2kvm-worker-hpa
    patch: |
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: hyper2kvm-worker-hpa
      spec:
        minReplicas: 1
        maxReplicas: 3

commonLabels:
  environment: dev
