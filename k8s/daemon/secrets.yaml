apiVersion: v1
kind: Secret
metadata:
  name: h2kvm-ssh-keys
  namespace: vm-migration
  labels:
    app.kubernetes.io/name: h2kvm
type: Opaque
stringData:
  # Replace with your actual SSH private key
  id_rsa: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    # Your SSH private key here
    -----END OPENSSH PRIVATE KEY-----

  # Replace with your known_hosts entries
  known_hosts: |
    # ESXi host fingerprints
    # 192.168.1.100 ssh-rsa AAAAB3Nza...
