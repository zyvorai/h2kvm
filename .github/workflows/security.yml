name: Security Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  security:
    name: Security Scanning
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install hatch pip-audit

    - name: Run security scans
      run: |
        hatch run security-audit
        hatch run security

    - name: Check for known vulnerabilities in dependencies
      run: |
        pip-audit --desc
      continue-on-error: true

    - name: Upload security results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: security-results
        path: security-report.json
        retention-days: 30

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    # Only run on public repos or when dependency graph is enabled
    # Requires: Settings > Security > Dependency graph to be enabled
    if: github.event_name == 'pull_request' && github.repository_visibility == 'public'
    continue-on-error: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Dependency Review
      uses: actions/dependency-review-action@v4
      continue-on-error: true
      with:
        fail-on-severity: high
