name: Pylint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  pylint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run pylint via hatch
      run: |
        pip install "hypersdk-guestkit>=1.0.1"
        hatch run run-pylint --disable=import-error,import-outside-toplevel,unused-import || \
          hatch run run-pylint -- --disable=import-error,import-outside-toplevel,unused-import
