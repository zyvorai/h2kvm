name: Matrix Testing

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: quality-${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            quality-${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint check
        run: ruff check .

      - name: Mypy type check
        run: mypy h2kvm/

      - name: Check for security issues
        run: bandit -r h2kvm/ -ll

  unit-tests-matrix:
    name: Unit Tests - Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: code-quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-13, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
        exclude:
          - os: macos-13
            python-version: '3.10'
          - os: macos-latest
            python-version: '3.10'

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Display Python version
        run: python --version

      - name: Install system dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvirt-dev \
            qemu-utils \
            lvm2 \
            nbd-client \
            cryptsetup

      - name: Install system dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install qemu

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .[dev,test]

      - name: Run unit tests
        run: |
          pytest tests/unit/ \
            -v \
            -n auto \
            --maxfail=10 \
            --tb=short \
            --cov=h2kvm \
            --cov-report=xml \
            --cov-report=term-missing:skip-covered \
            --junitxml=junit.xml

      - name: Upload coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-24.04'
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          flags: unit-tests
          name: ${{ matrix.os }}-py${{ matrix.python-version }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: junit.xml
          retention-days: 7

  integration-tests:
    name: Integration Tests - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvirt-dev \
            libvirt-daemon-system \
            qemu-kvm \
            qemu-utils \
            lvm2 \
            nbd-client \
            nbd-server \
            cryptsetup

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]

      - name: Run integration tests
        run: |
          pytest tests/integration/ \
            -v \
            -m integration \
            --maxfail=5 \
            --tb=short \
            --junitxml=junit-integration.xml

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-results-py${{ matrix.python-version }}
          path: junit-integration.xml
          retention-days: 7

  test-minimal-deps:
    name: Test with Minimal Dependencies
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.10 (minimum version)
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Test import
        run: |
          python -c "import h2kvm; print(h2kvm.__version__)"

  test-coverage-report:
    name: Generate Coverage Report
    runs-on: ubuntu-latest
    needs: unit-tests-matrix
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,test]

      - name: Run tests with coverage
        run: |
          pytest tests/unit/ \
            -n auto \
            --cov=h2kvm \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 30

      - name: Check coverage threshold
        run: |
          coverage report --fail-under=80 || echo "Coverage below 80%"

  test-documentation:
    name: Documentation Build Test
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install sphinx sphinx-rtd-theme

      - name: Build documentation
        run: |
          sphinx-build -b html -W --keep-going docs/ docs/_build/html

      - name: Upload documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: docs/_build/html/
          retention-days: 7

  test-package-build:
    name: Test Package Build
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: package-dist
          path: dist/
          retention-days: 7

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests-matrix, integration-tests, test-minimal-deps,
 test-package-build]
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "All test jobs completed"
          echo "Check individual job results above"
