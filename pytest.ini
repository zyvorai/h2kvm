[pytest]
testpaths = h2kvm/vmspawn/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage options
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov=h2kvm.vmspawn
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml

# Markers for test categorization
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
    requires_kvm: Tests that require KVM device access
    requires_systemd: Tests that require systemd-vmspawn

# Test discovery patterns
norecursedirs = .git .tox dist build *.egg

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests
timeout = 300
