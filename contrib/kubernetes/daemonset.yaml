apiVersion: v1
kind: Namespace
metadata:
  name: h2kvm-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: h2kvm-luks-unlocker
  namespace: h2kvm-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: h2kvm-luks-unlocker
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: h2kvm-luks-unlocker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: h2kvm-luks-unlocker
subjects:
- kind: ServiceAccount
  name: h2kvm-luks-unlocker
  namespace: h2kvm-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: h2kvm-luks-config
  namespace: h2kvm-system
data:
  luks.json: |
    {
      "tpm_handle": "0x81000010",
      "vault": {
        "addr": "https://vault.vault.svc:8200",
        "path": "secret/h2kvm/luks"
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: h2kvm-luks-unlocker
  namespace: h2kvm-system
  labels:
    app: h2kvm-luks-unlocker
spec:
  selector:
    matchLabels:
      app: h2kvm-luks-unlocker
  template:
    metadata:
      labels:
        app: h2kvm-luks-unlocker
    spec:
      serviceAccountName: h2kvm-luks-unlocker
      hostPID: true
      hostIPC: true
      containers:
      - name: unlocker
        image: h2kvm/luks-unlocker:latest
        imagePullPolicy: IfNotPresent

        securityContext:
          privileged: true
          capabilities:
            add:
            - SYS_ADMIN
            - SYS_MODULE
            - SYS_RAWIO

        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: VAULT_ADDR
          value: "https://vault.vault.svc:8200"
        - name: VAULT_TOKEN
          valueFrom:
            secretKeyRef:
              name: vault-token
              key: token
              optional: true

        volumeMounts:
        - name: dev
          mountPath: /dev
        - name: sys
          mountPath: /sys
        - name: config
          mountPath: /etc/h2kvm
          readOnly: true
        - name: run-cryptsetup
          mountPath: /run/cryptsetup
        - name: lib-modules
          mountPath: /lib/modules
          readOnly: true

        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "H2KVM LUKS Unlocker starting on node: $NODE_NAME"

          # Load necessary kernel modules
          modprobe dm-crypt || true
          modprobe tpm || true
          modprobe tpm_tis || true

          # Run unlock
          h2kvm-luks unlock -v

          # Activate LVM volumes
          pvscan --cache
          vgchange -ay

          # Keep container running
          echo "Unlock complete. Monitoring for new devices..."
          while true; do
            sleep 3600
          done

        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"

      volumes:
      - name: dev
        hostPath:
          path: /dev
          type: Directory
      - name: sys
        hostPath:
          path: /sys
          type: Directory
      - name: config
        configMap:
          name: h2kvm-luks-config
      - name: run-cryptsetup
        hostPath:
          path: /run/cryptsetup
          type: DirectoryOrCreate
      - name: lib-modules
        hostPath:
          path: /lib/modules
          type: Directory

      nodeSelector:
        # Only run on nodes with LUKS
        h2kvm.io/luks: "true"

      tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists
