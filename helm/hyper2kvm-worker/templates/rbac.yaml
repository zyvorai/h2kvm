{{- if .Values.rbac.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hyper2kvm-worker.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyper2kvm-worker.labels" . | nindent 4 }}
  {{- with .Values.rbac.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "hyper2kvm-worker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyper2kvm-worker.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "patch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "hyper2kvm-worker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyper2kvm-worker.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "hyper2kvm-worker.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "hyper2kvm-worker.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
