{{- if .Values.storage.state.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "hyper2kvm-worker.fullname" . }}-state
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyper2kvm-worker.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.storage.state.accessMode }}
  {{- if .Values.storage.state.storageClass }}
  storageClassName: {{ .Values.storage.state.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.state.size }}
{{- end }}

