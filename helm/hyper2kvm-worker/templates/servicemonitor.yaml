{{- if and .Values.monitoring.metrics.enabled .Values.monitoring.serviceMonitor.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hyper2kvm-worker.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyper2kvm-worker.labels" . | nindent 4 }}
    component: metrics
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "hyper2kvm-worker.selectorLabels" . | nindent 4 }}
  ports:
  - name: metrics
    port: {{ .Values.monitoring.metrics.port }}
    targetPort: {{ .Values.monitoring.metrics.port }}
    protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "hyper2kvm-worker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyper2kvm-worker.labels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "hyper2kvm-worker.selectorLabels" . | nindent 6 }}
      component: metrics
  endpoints:
  - port: metrics
    interval: {{ .Values.monitoring.serviceMonitor.interval }}
    scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout }}
    path: {{ .Values.monitoring.metrics.path }}
{{- end }}
