{{- if .Values.testing.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "hyper2kvm-operator.fullname" . }}-test-connection
  namespace: {{ include "hyper2kvm-operator.namespace" . }}
  labels:
    {{- include "hyper2kvm-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: {{ .Values.testing.image.repository }}:{{ .Values.testing.image.tag | default .Chart.AppVersion }}
      imagePullPolicy: {{ .Values.testing.image.pullPolicy }}
      command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Testing operator health endpoint..."
          python3 -c "
          import sys
          import http.client

          conn = http.client.HTTPConnection('{{ include "hyper2kvm-operator.fullname" . }}.{{ include "hyper2kvm-operator.namespace" . }}.svc.cluster.local', 8080)
          conn.request('GET', '/healthz')
          response = conn.getresponse()

          if response.status == 200:
              print('✓ Operator health check passed')
              sys.exit(0)
          else:
              print(f'✗ Operator health check failed: {response.status}')
              sys.exit(1)
          "

          {{- if .Values.webhook.enabled }}
          echo "Testing webhook health endpoint..."
          python3 -c "
          import sys
          import http.client

          conn = http.client.HTTPConnection('{{ include "hyper2kvm-operator.webhookServiceName" . }}.{{ include "hyper2kvm-operator.namespace" . }}.svc.cluster.local', 8080)
          conn.request('GET', '/healthz')
          response = conn.getresponse()

          if response.status == 200:
              print('✓ Webhook health check passed')
              sys.exit(0)
          else:
              print(f'✗ Webhook health check failed: {response.status}')
              sys.exit(1)
          "
          {{- end }}

          echo "Testing CRD installation..."
          python3 -c "
          import sys
          import subprocess

          result = subprocess.run(
              ['kubectl', 'get', 'crd', 'migrationjobs.hyper2kvm.io'],
              capture_output=True,
              text=True
          )

          if result.returncode == 0:
              print('✓ MigrationJob CRD is installed')
              sys.exit(0)
          else:
              print('✗ MigrationJob CRD not found')
              sys.exit(1)
          "

          echo ""
          echo "All tests passed! ✓"
{{- end }}
