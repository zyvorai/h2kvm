apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hyper2kvm-operator.fullname" . }}
  namespace: {{ include "hyper2kvm-operator.namespace" . }}
  labels:
    {{- include "hyper2kvm-operator.operatorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      {{- include "hyper2kvm-operator.operatorSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/operator-configmap.yaml") . | sha256sum }}
        {{- with .Values.operator.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "hyper2kvm-operator.operatorSelectorLabels" . | nindent 8 }}
        {{- with .Values.operator.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "hyper2kvm-operator.serviceAccountName" . }}
      {{- with .Values.operator.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      containers:
        - name: operator
          image: {{ include "hyper2kvm-operator.operatorImage" . }}
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          {{- with .Values.operator.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - python3
            - -m
            - hyper2kvm.operator.cli
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPERATOR_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RECONCILE_INTERVAL
              value: {{ .Values.operator.config.reconcileInterval | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.operator.config.logLevel | quote }}
            - name: VERBOSE
              value: {{ .Values.operator.config.verbose | quote }}
            - name: WORKER_DISCOVERY_INTERVAL
              value: {{ .Values.operator.config.workerDiscoveryInterval | quote }}
            - name: MAX_CONCURRENT_RECONCILES
              value: {{ .Values.operator.config.maxConcurrentReconciles | quote }}
            - name: LEADER_ELECTION_ENABLED
              value: {{ .Values.operator.leaderElection.enabled | quote }}
            - name: LEADER_ELECTION_LEASE_NAME
              value: {{ .Values.operator.leaderElection.leaseName | quote }}
            - name: LEADER_ELECTION_LEASE_DURATION
              value: {{ .Values.operator.leaderElection.leaseDuration | quote }}
            - name: LEADER_ELECTION_RENEW_DEADLINE
              value: {{ .Values.operator.leaderElection.renewDeadline | quote }}
            - name: LEADER_ELECTION_RETRY_PERIOD
              value: {{ .Values.operator.leaderElection.retryPeriod | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- with .Values.operator.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.operator.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.operator.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
{{- if and .Values.openshift.enabled .Values.openshift.oauth.enabled }}
        # OAuth Proxy sidecar for authenticated metrics access
        - name: oauth-proxy
          image: {{ .Values.openshift.oauth.image.repository }}:{{ .Values.openshift.oauth.image.tag }}
          imagePullPolicy: {{ .Values.openshift.oauth.image.pullPolicy }}
          args:
            - --https-address=:{{ .Values.openshift.oauth.port }}
            - --provider=openshift
            - --openshift-service-account={{ include "hyper2kvm-operator.fullname" . }}-oauth-proxy
            - --upstream=http://localhost:8080
            - --tls-cert=/etc/tls/private/tls.crt
            - --tls-key=/etc/tls/private/tls.key
            - --cookie-secret-file=/etc/proxy/secrets/session_secret
            - --openshift-ca=/etc/pki/tls/cert.pem
            - --openshift-ca=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            - --skip-auth-regex=^/metrics
          ports:
            - name: oauth-proxy
              containerPort: {{ .Values.openshift.oauth.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.openshift.oauth.resources | nindent 12 }}
          volumeMounts:
            - name: oauth-tls
              mountPath: /etc/tls/private
              readOnly: true
            - name: oauth-session
              mountPath: /etc/proxy/secrets
              readOnly: true
{{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- if and .Values.openshift.enabled .Values.openshift.oauth.enabled }}
        - name: oauth-tls
          secret:
            secretName: {{ include "hyper2kvm-operator.fullname" . }}-oauth-tls
        - name: oauth-session
          secret:
            secretName: {{ include "hyper2kvm-operator.fullname" . }}-oauth-session
{{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.operator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
