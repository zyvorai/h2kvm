{{- if .Values.webhook.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "h2kvm-operator.fullname" . }}-webhook-config
  namespace: {{ include "h2kvm-operator.namespace" . }}
  labels:
    {{- include "h2kvm-operator.webhookLabels" . | nindent 4 }}
data:
  max_jobs_per_namespace: {{ .Values.webhook.config.maxJobsPerNamespace | quote }}
  validating_failure_policy: {{ .Values.webhook.config.validatingFailurePolicy | quote }}
  mutating_failure_policy: {{ .Values.webhook.config.mutatingFailurePolicy | quote }}
  timeout_seconds: {{ .Values.webhook.config.timeoutSeconds | quote }}
  default_priority: {{ .Values.webhook.config.defaults.priority | quote }}
  default_timeout: {{ .Values.webhook.config.defaults.timeout | quote }}
  default_retry_max_retries: {{ .Values.webhook.config.defaults.retryPolicy.maxRetries | quote }}
  default_retry_backoff: {{ .Values.webhook.config.defaults.retryPolicy.backoff | quote }}
  default_output_format: {{ .Values.webhook.config.defaults.outputFormat | quote }}
{{- end }}
