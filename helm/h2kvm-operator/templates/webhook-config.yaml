{{- if .Values.webhook.enabled }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "h2kvm-operator.fullname" . }}-validating
  labels:
    {{- include "h2kvm-operator.webhookLabels" . | nindent 4 }}
  {{- if .Values.webhook.tls.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ include "h2kvm-operator.namespace" . }}/{{ include "h2kvm-operator.webhookCertSecretName" . }}
  {{- end }}
webhooks:
  - name: validate.migrationjob.h2kvm.io
    clientConfig:
      service:
        name: {{ include "h2kvm-operator.webhookServiceName" . }}
        namespace: {{ include "h2kvm-operator.namespace" . }}
        path: /validate
      {{- if not .Values.webhook.tls.certManager.enabled }}
      caBundle: {{ include "h2kvm-operator.webhookCABundle" . }}
      {{- end }}
    rules:
      - apiGroups:
          - h2kvm.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - migrationjobs
        scope: Namespaced
    admissionReviewVersions:
      - v1
      - v1beta1
    sideEffects: None
    failurePolicy: {{ .Values.webhook.config.validatingFailurePolicy }}
    timeoutSeconds: {{ .Values.webhook.config.timeoutSeconds }}
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - key: control-plane
          operator: DoesNotExist

---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "h2kvm-operator.fullname" . }}-mutating
  labels:
    {{- include "h2kvm-operator.webhookLabels" . | nindent 4 }}
  {{- if .Values.webhook.tls.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ include "h2kvm-operator.namespace" . }}/{{ include "h2kvm-operator.webhookCertSecretName" . }}
  {{- end }}
webhooks:
  - name: mutate.migrationjob.h2kvm.io
    clientConfig:
      service:
        name: {{ include "h2kvm-operator.webhookServiceName" . }}
        namespace: {{ include "h2kvm-operator.namespace" . }}
        path: /mutate
      {{- if not .Values.webhook.tls.certManager.enabled }}
      caBundle: {{ include "h2kvm-operator.webhookCABundle" . }}
      {{- end }}
    rules:
      - apiGroups:
          - h2kvm.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
        resources:
          - migrationjobs
        scope: Namespaced
    admissionReviewVersions:
      - v1
      - v1beta1
    sideEffects: None
    failurePolicy: {{ .Values.webhook.config.mutatingFailurePolicy }}
    timeoutSeconds: {{ .Values.webhook.config.timeoutSeconds }}
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - key: control-plane
          operator: DoesNotExist
    reinvocationPolicy: Never
{{- end }}
