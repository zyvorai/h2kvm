{{- if and .Values.openshift.enabled .Values.openshift.oauth.enabled -}}
---
# Service for OAuth proxy (authenticated metrics access)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "h2kvm-operator.fullname" . }}-oauth
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "h2kvm-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: oauth-proxy
  annotations:
    service.alpha.openshift.io/serving-cert-secret-name: {{ include "h2kvm-operator.fullname" . }}-oauth-tls
spec:
  type: ClusterIP
  ports:
    - name: oauth-proxy
      port: {{ .Values.openshift.oauth.port }}
      targetPort: oauth-proxy
      protocol: TCP
  selector:
    {{- include "h2kvm-operator.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: operator

---
# Secret for OAuth session (auto-generated)
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "h2kvm-operator.fullname" . }}-oauth-session
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "h2kvm-operator.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.openshift.oauth.sessionSecret }}
  session_secret: {{ .Values.openshift.oauth.sessionSecret | b64enc }}
  {{- else }}
  session_secret: {{ randAlphaNum 32 | b64enc }}
  {{- end }}

---
# ServiceAccount for OAuth proxy
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "h2kvm-operator.fullname" . }}-oauth-proxy
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "h2kvm-operator.labels" . | nindent 4 }}
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"{{ include "h2kvm-operator.fullname" . }}-metrics"}}'

---
# ClusterRoleBinding for OAuth proxy to check tokens
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "h2kvm-operator.fullname" . }}-oauth-proxy
  labels:
    {{- include "h2kvm-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "h2kvm-operator.fullname" . }}-oauth-proxy
    namespace: {{ .Values.global.namespace }}
{{- end }}
