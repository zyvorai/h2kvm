{{- if and .Values.openshift.enabled .Values.openshift.route.enabled -}}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "h2kvm-operator.fullname" . }}-metrics
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "h2kvm-operator.labels" . | nindent 4 }}
    {{- with .Values.openshift.templateMetadata.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- with .Values.openshift.templateMetadata.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.openshift.route.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.openshift.route.host }}
  host: {{ .Values.openshift.route.host }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "h2kvm-operator.fullname" . }}-metrics
    weight: 100
  port:
    targetPort: metrics
  {{- if .Values.openshift.route.tls }}
  tls:
    termination: {{ .Values.openshift.route.tls.termination }}
    {{- if .Values.openshift.route.tls.insecureEdgeTerminationPolicy }}
    insecureEdgeTerminationPolicy: {{ .Values.openshift.route.tls.insecureEdgeTerminationPolicy }}
    {{- end }}
    {{- if .Values.openshift.route.tls.certificate }}
    certificate: |
{{ .Values.openshift.route.tls.certificate | indent 6 }}
    {{- end }}
    {{- if .Values.openshift.route.tls.key }}
    key: |
{{ .Values.openshift.route.tls.key | indent 6 }}
    {{- end }}
    {{- if .Values.openshift.route.tls.caCertificate }}
    caCertificate: |
{{ .Values.openshift.route.tls.caCertificate | indent 6 }}
    {{- end }}
  {{- end }}
  wildcardPolicy: None
---
{{- if .Values.webhook.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "h2kvm-operator.fullname" . }}-webhook
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "h2kvm-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
    {{- with .Values.openshift.templateMetadata.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- with .Values.openshift.templateMetadata.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.openshift.route.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.openshift.route.host }}
  host: webhook-{{ .Values.openshift.route.host }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "h2kvm-operator.fullname" . }}-webhook
    weight: 100
  port:
    targetPort: webhook
  tls:
    # Webhook requires passthrough (TLS handled by webhook server)
    termination: passthrough
  wildcardPolicy: None
{{- end }}
{{- end }}
