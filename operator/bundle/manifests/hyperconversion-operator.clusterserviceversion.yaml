  description: |
    ## HyperConversion Operator

    The HyperConversion Operator automates the migration of VM disk images to KubeVirt VirtualMachines.
    It provides a declarative API for converting disks from various formats (VMDK, VDI, VHD, QCOW2)
    and automatically creating ready-to-run VirtualMachines in your Kubernetes cluster.

    ### Key Features

    - **Automated Disk Conversion**: Convert VM disks from VMDK, VDI, VHD, VHDX, QCOW2, or RAW formats
    - **Multi-Disk Support**: Create VMs with multiple storage volumes (data, logs, backups)
    - **Multi-Architecture**: AMD64, ARM64, s390x, ppc64le support
    - **Cloud-Init Integration**: Pre-built templates for Ubuntu, CentOS, Debian, Kubernetes, Docker
    - **Storage Flexibility**: Support for HTTP/HTTPS, S3, and direct PVC sources
    - **Boot Order Control**: Configure boot sequence for multi-disk VMs
    - **CLI Tool (h2kctl)**: Command-line interface for easy management
    - **Production Ready**: Webhooks, metrics, RBAC, event logging

    ### Supported Disk Sources

    - **HTTP/HTTPS**: Direct URL to disk image
    - **S3**: AWS S3 or compatible storage (MinIO, Ceph RGW)
    - **Existing PVC**: Clone from existing PersistentVolumeClaim
    - **Blank Disks**: Create empty disks for formatting

    ### Quick Start

    1. Install the operator (requires KubeVirt and CDI):
       ```
       kubectl create -f https://operatorhub.io/install/hyperconversion-operator.yaml
       ```

    2. Create a HyperConversion resource:
       ```yaml
       apiVersion: hyper2kvm.io/v1alpha1
       kind: HyperConversion
       metadata:
         name: my-vm-migration
       spec:
         source:
           url: "http://example.com/disk.vmdk"
           format: vmdk
         storage:
           size: 20Gi
         vm:
           name: my-vm
           cpu:
             cores: 4
           memory: 8Gi
       ```

    3. Monitor progress:
       ```
       kubectl get hyperconversion my-vm-migration -w
       ```

    ### Prerequisites

    - **KubeVirt** v1.0.0+: VM virtualization for Kubernetes
    - **CDI** v1.58.0+: Containerized Data Importer for disk provisioning
    - **StorageClass**: Dynamic storage provisioning capability

    ### Use Cases

    - **VM Migration**: Migrate existing VMs to Kubernetes
    - **Development Environments**: Quickly spin up development VMs
    - **Testing**: Create disposable VM environments
    - **Disaster Recovery**: Convert backup images to running VMs
    - **Modernization**: Lift-and-shift workloads to Kubernetes

    ### Multi-Disk VMs

    Create VMs with separate volumes for OS, data, and backups:

    ```yaml
    spec:
      vm:
        additionalDisks:
          - name: data-disk
            source:
              blank: true
            size: 50Gi
            bus: virtio
          - name: database-disk
            source:
              url: "http://example.com/db.qcow2"
            size: 100Gi
            storageClass: fast-ssd
    ```

    ### Documentation

    - [Getting Started Guide](https://github.com/ssahani/hyper2kvm/blob/main/operator/README.md)
    - [Cloud-Init Templates](https://github.com/ssahani/hyper2kvm/blob/main/operator/templates/cloud-init/README.md)
    - [Multi-Disk Configuration](https://github.com/ssahani/hyper2kvm/blob/main/operator/docs/MULTI_DISK.md)
    - [Multi-Architecture Support](https://github.com/ssahani/hyper2kvm/blob/main/operator/docs/MULTI_ARCH.md)

    ### Support

    - GitHub Issues: [https://github.com/ssahani/hyper2kvm/issues](https://github.com/ssahani/hyper2kvm/issues)
    - Documentation: [https://github.com/ssahani/hyper2kvm](https://github.com/ssahani/hyper2kvm)

