#cloud-config
# Kubernetes Node Cloud-Init Template
# Prepares a VM to join a Kubernetes cluster

hostname: k8s-node
fqdn: k8s-node.cluster.local

# Create admin user
users:
  - name: k8s-admin
    groups: sudo
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    ssh_authorized_keys:
      - ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC... # Replace with your SSH public key

# Update packages
package_update: true
package_upgrade: true

# Install Docker and Kubernetes prerequisites
packages:
  - curl
  - wget
  - git
  - apt-transport-https
  - ca-certificates
  - gnupg
  - lsb-release
  - qemu-guest-agent
  - containerd
  - socat
  - conntrack
  - ipset

# Configure SSH
ssh_pwauth: false
disable_root: true

# Set timezone
timezone: UTC

# Disable swap (required for Kubernetes)
swap:
  filename: /swapfile
  size: 0
  maxsize: 0

# Kernel modules for Kubernetes
bootcmd:
  - modprobe overlay
  - modprobe br_netfilter

# Sysctl settings for Kubernetes
write_files:
  - path: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    permissions: '0644'

  - path: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
    permissions: '0644'

  - path: /etc/containerd/config.toml
    content: |
      version = 2
      [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
        [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
          SystemdCgroup = true
    permissions: '0644'

# Commands to run
runcmd:
  # Apply sysctl settings
  - sysctl --system

  # Disable swap
  - swapoff -a
  - sed -i '/ swap / s/^\(.*\)$/#\1/g' /etc/fstab

  # Configure containerd
  - mkdir -p /etc/containerd
  - systemctl restart containerd
  - systemctl enable containerd

  # Add Kubernetes repo
  - curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.28/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  - echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.28/deb/ /' | tee /etc/apt/sources.list.d/kubernetes.list

  # Install kubeadm, kubelet, kubectl
  - apt-get update
  - apt-get install -y kubelet kubeadm kubectl
  - apt-mark hold kubelet kubeadm kubectl

  # Enable qemu-guest-agent
  - systemctl enable qemu-guest-agent
  - systemctl start qemu-guest-agent

  # Log completion
  - echo "Kubernetes node preparation completed at $(date)" >> /var/log/cloud-init-k8s.log

# Final message
final_message: "Kubernetes node ready. Run 'kubeadm join' to add to cluster. Boot completed in $UPTIME seconds"
