#cloud-config
# Ubuntu Server Cloud-Init Template
# Configures a basic Ubuntu server with SSH access and common tools

hostname: ubuntu-server
fqdn: ubuntu-server.local

# Create default user
users:
  - name: ubuntu
    groups: sudo
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    ssh_authorized_keys:
      - ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC... # Replace with your SSH public key

# Update and upgrade packages
package_update: true
package_upgrade: true

# Install essential packages
packages:
  - curl
  - wget
  - git
  - vim
  - htop
  - net-tools
  - qemu-guest-agent
  - cloud-init
  - cloud-utils

# Configure SSH
ssh_pwauth: false
disable_root: true

# Set timezone
timezone: UTC

# Configure NTP
ntp:
  enabled: true
  servers:
    - 0.pool.ntp.org
    - 1.pool.ntp.org
    - 2.pool.ntp.org

# Run commands on first boot
runcmd:
  - echo "Cloud-init completed at $(date)" >> /var/log/cloud-init-custom.log
  - systemctl enable qemu-guest-agent
  - systemctl start qemu-guest-agent

# Write files
write_files:
  - path: /etc/motd
    content: |
      Welcome to Ubuntu Server
      Deployed via HyperConversion Operator
    permissions: '0644'

# Final message
final_message: "System boot completed in $UPTIME seconds"
