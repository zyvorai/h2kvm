apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: validations.hyper2kvm.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.12.0
spec:
  group: hyper2kvm.io
  names:
    kind: Validation
    listKind: ValidationList
    plural: validations
    singular: validation
    shortNames:
      - h2kv
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: Validation is the Schema for VM validation
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: ValidationSpec defines the desired state of Validation
              type: object
              required:
                - image
              properties:
                image:
                  description: Disk image path or PVC name
                  type: string
                memory:
                  description: Memory in MB
                  type: integer
                  default: 2048
                cpus:
                  description: Number of CPUs
                  type: integer
                  default: 2
                timeout:
                  description: Validation timeout in seconds
                  type: integer
                  default: 300
                tpm:
                  description: Enable TPM emulation
                  type: boolean
                  default: false
                vsock:
                  description: Enable vsock communication
                  type: boolean
                  default: true
                cloudInit:
                  description: Cloud-init user-data
                  type: string
                kubernetesValidation:
                  description: Enable Kubernetes node validation
                  type: boolean
                  default: false
                createKubeVirtVM:
                  description: Create KubeVirt VM after successful validation
                  type: boolean
                  default: false
                kubevirtTemplate:
                  description: KubeVirt VM template
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              description: ValidationStatus defines the observed state of Validation
              type: object
              properties:
                phase:
                  description: Current phase of validation
                  type: string
                  enum:
                    - Pending
                    - Running
                    - Validated
                    - Failed
                    - KubeVirtCreated
                validated:
                  description: Whether validation passed
                  type: boolean
                  default: false
                message:
                  description: Human-readable message
                  type: string
                validationPod:
                  description: Name of validation pod
                  type: string
                kubevirtVM:
                  description: Name of created KubeVirt VM
                  type: string
                startTime:
                  description: Validation start time
                  type: string
                  format: date-time
                completionTime:
                  description: Validation completion time
                  type: string
                  format: date-time
                checks:
                  description: Individual validation checks
                  type: object
                  properties:
                    systemd:
                      type: boolean
                    network:
                      type: boolean
                    bootComplete:
                      type: boolean
                    cloudInit:
                      type: boolean
                    kubelet:
                      type: boolean
                    containerRuntime:
                      type: boolean
                    cni:
                      type: boolean
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Validated
          type: boolean
          jsonPath: .status.validated
        - name: KubeVirt VM
          type: string
          jsonPath: .status.kubevirtVM
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
