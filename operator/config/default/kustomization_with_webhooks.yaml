# Kustomization for deployment with webhooks enabled
namespace: hyper2kvm-system

namePrefix: hyperconversion-

# Labels to add to all resources
commonLabels:
  app.kubernetes.io/name: hyperconversion-operator
  app.kubernetes.io/component: controller

resources:
- ../crd
- ../rbac
- ../manager
- ../webhook
- ../certmanager
- ../prometheus
- ../network

patchesStrategicMerge:
# Enable webhook and cert-manager
- manager_webhook_patch.yaml

# Protect metrics endpoint with auth proxy
#- manager_auth_proxy_patch.yaml

images:
- name: controller
  newName: hyper2kvm-operator
  newTag: webhook-test

vars:
# Generate secrets for webhook certificates
- name: CERTIFICATE_NAMESPACE
  objref:
    kind: Certificate
    group: cert-manager.io
    version: v1
    name: serving-cert
  fieldref:
    fieldpath: metadata.namespace
- name: CERTIFICATE_NAME
  objref:
    kind: Certificate
    group: cert-manager.io
    version: v1
    name: serving-cert
- name: SERVICE_NAMESPACE
  objref:
    kind: Service
    version: v1
    name: webhook-service
  fieldref:
    fieldpath: metadata.namespace
- name: SERVICE_NAME
  objref:
    kind: Service
    version: v1
    name: webhook-service
