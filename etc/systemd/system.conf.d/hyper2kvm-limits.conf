# Hyper2KVM Systemd Resource Limits
#
# Increases default resource limits for all systemd services.
# Particularly important for parallel VM conversion operations.
#
# Installation:
#   sudo mkdir -p /etc/systemd/system.conf.d/
#   sudo cp hyper2kvm-limits.conf /etc/systemd/system.conf.d/
#   sudo systemctl daemon-reexec
#
# Verify:
#   systemctl show --property DefaultLimitNOFILE
#   systemctl show --property DefaultLimitNPROC

[Manager]
# File descriptor limit (prevents "Too many open files")
# Default is usually 1024, insufficient for parallel operations
DefaultLimitNOFILE=1048576

# Process limit (for parallel conversions)
# Default is usually 4096
DefaultLimitNPROC=1048576

# Core dump size (disable for production)
DefaultLimitCORE=0

# Stack size (increase for deep recursion)
DefaultLimitSTACK=16777216
