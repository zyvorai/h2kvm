# NBD (Network Block Device) Configuration for H2KVM
#
# Configures NBD kernel module for parallel VM conversions.
#
# Installation:
#   sudo cp nbd.conf /etc/modprobe.d/
#   sudo modprobe -r nbd
#   sudo modprobe nbd
#
# Or apply at boot:
#   This file is automatically loaded by modprobe

# Maximum NBD devices (default: 16)
# Increase to 64 or 128 for parallel conversions
# Each concurrent conversion needs one NBD device
options nbd nbds_max=128

# Maximum partitions per NBD device (default: 0)
# Set to 16 to support GPT and extended partitions
options nbd max_part=16
