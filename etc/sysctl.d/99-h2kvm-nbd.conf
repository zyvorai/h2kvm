# H2KVM NBD and File Descriptor Configuration
#
# Increases system limits for reliable VM conversion operations
# with NBD devices and namespace isolation.
#
# Installation:
#   sudo cp 99-h2kvm-nbd.conf /etc/sysctl.d/
#   sudo sysctl --system
#
# Or apply temporarily:
#   sudo sysctl -p 99-h2kvm-nbd.conf

# Inotify watches (prevents "Too many open files" from udev)
# Default is usually 8192-128000, insufficient for automation
fs.inotify.max_user_watches = 1048576

# Inotify instances (one per process watching files)
# Default is usually 128, insufficient for parallel conversions
fs.inotify.max_user_instances = 1048576

# System-wide file descriptor limit
# Default is usually 1024-65536, insufficient for 32+ parallel jobs
fs.file-max = 2097152

# Maximum number of memory map areas a process may have
# Useful for large NBD/LVM operations
vm.max_map_count = 262144

# Increase PID limit for parallel conversions
kernel.pid_max = 4194304

# TCP settings for remote storage (optional, if using iSCSI/NFS)
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
net.ipv4.tcp_rmem = 4096 87380 134217728
net.ipv4.tcp_wmem = 4096 65536 134217728
