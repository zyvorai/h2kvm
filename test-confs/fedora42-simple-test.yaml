# Fedora 42 Server - Simplified Test (Focus on Core Features)
# Tests essential h2kvm functionality without complex cloud-init

cmd: local

# Source VMDK
vmdk: /home/ssahani/Downloads/VMs/extracted/fedora/64bit/fedora42-server.vmdk

# Output Configuration
output_dir: /home/ssahani/tt/h2kvm/out/fedora42-test
to_output: /home/ssahani/tt/h2kvm/out/fedora42-test/fedora42-server.qcow2
out_format: qcow2
compress: true
workdir: /home/ssahani/tt/h2kvm/out/fedora42-test/work

# Core Linux Fixes
fstab_fixes_enable: true
grub_fixes_enable: true
initramfs_regen_enable: true
initramfs_regen_force: true

# VirtIO modules for initramfs
initramfs_modules:
  - virtio_blk
  - virtio_scsi
  - virtio_net
  - virtio_pci

# Network fixes
network_fixes_enable: true

# Libvirt XML generation
libvirt_xml_generate: true
libvirt_vm_name: fedora42-server
libvirt_memory_mb: 4096
libvirt_vcpus: 2

# Reporting
report: /home/ssahani/tt/h2kvm/out/fedora42-test/migration-report.md
log_file: /home/ssahani/tt/h2kvm/out/fedora42-test/migration.log
verbose: 2
dry_run: false
