# Ubuntu - Downloaded VMDK Test
# Convert and deploy to libvirt

cmd: local

# Source VMDK
vmdk: /home/ssahani/Downloads/ubuntu/ubuntu.vmdk

# Output Configuration
output_dir: /home/ssahani/tt/h2kvm/out/ubuntu-download-test
to_output: /home/ssahani/tt/h2kvm/out/ubuntu-download-test/ubuntu.qcow2
out_format: qcow2
compress: true
workdir: /home/ssahani/tt/h2kvm/out/ubuntu-download-test/work

# Core Linux Fixes
fstab_fixes_enable: true
fstab_mode: stabilize-all
fstab_prefer_partuuid: true  # Ubuntu prefers PARTUUID
fstab_optimize_options: true

grub_fixes_enable: true
initramfs_regen_enable: true
initramfs_regen_force: true

# VirtIO modules for initramfs
initramfs_modules:
  - virtio_blk
  - virtio_scsi
  - virtio_net
  - virtio_pci
  - virtio_balloon
  - virtio_console

# Network fixes
network_fixes_enable: true
use_netplan: true  # Ubuntu uses netplan

# Libvirt XML generation and import
libvirt_xml_generate: true
libvirt_vm_name: ubuntu-test
libvirt_memory_mb: 4096
libvirt_vcpus: 2
libvirt_disk_bus: virtio
libvirt_import: true  # Auto-import to libvirt

# Reporting
report: /home/ssahani/tt/h2kvm/out/ubuntu-download-test/migration-report.md
log_file: /home/ssahani/tt/h2kvm/out/ubuntu-download-test/migration.log
verbose: 2
dry_run: false
