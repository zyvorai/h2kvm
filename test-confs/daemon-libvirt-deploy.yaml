# Daemon config: auto-deploy every converted VM to libvirt
#
# Usage:
#   1. sudo cp test-confs/daemon-libvirt-deploy.yaml /etc/hyper2kvm/daemon.yaml
#   2. sudo systemctl start hyper2kvm.service
#   3. Drop migration YAMLs into /var/lib/hyper2kvm/daemon/to_be_processed/
#
command: daemon
manifest_workflow_mode: true
manifest_workflow_dir: /var/lib/hyper2kvm/daemon
output_dir: /var/lib/hyper2kvm/output

# Conversion defaults
out_format: qcow2
flatten: true
compress: false
fstab_mode: stabilize-all
regen_initramfs: true

# Auto-deploy to libvirt
emit_domain_xml: true
virsh_define: true
memory: 2048
vcpus: 2
machine: q35
