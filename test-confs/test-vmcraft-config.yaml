# hyper2kvm migration configuration
# Testing with vmcraft backend (fast pure-Python LVM)
cmd: local

# Input
vmdk: ./esx8.0-rhel8.8-with-thin-provision-disk1.vmdk

# Output
output_dir: ./output
to_output: rhel8.8-vmcraft-fixed.qcow2
out_format: qcow2
compress: true

# Conversion options
flatten: true
fstab_mode: stabilize-all
regen_initramfs: true

# Backend: vmcraft for fast LVM operations
backend: vmcraft
