# Daemon config: auto-deploy to both libvirt AND KubeVirt
#
# Usage:
#   1. sudo cp test-confs/daemon-dual-deploy.yaml /etc/h2kvm/daemon.yaml
#   2. sudo systemctl start h2kvm.service
#   3. Drop migration YAMLs into /var/lib/h2kvm/daemon/to_be_processed/
#
# Each converted VM gets:
#   - libvirt domain XML + virsh define (immediate KVM boot)
#   - KubeVirt VirtualMachine manifest + kubectl apply
#
command: daemon
manifest_workflow_mode: true
manifest_workflow_dir: /var/lib/h2kvm/daemon
output_dir: /var/lib/h2kvm/output

# Conversion defaults
out_format: qcow2
flatten: true
compress: false
fstab_mode: stabilize-all
regen_initramfs: true

# Libvirt deploy
emit_domain_xml: true
virsh_define: true

# KubeVirt deploy
deploy_k8s: true
kubeconfig: /etc/kubernetes/admin.conf
k8s_namespace: default

# VM defaults (can be overridden per job)
memory: 4096
vcpus: 4
machine: q35
