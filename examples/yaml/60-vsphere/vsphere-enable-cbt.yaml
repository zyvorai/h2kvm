# Run with primary command (recommended):
#   h2kvmctl --config 60-vsphere/vsphere-enable-cbt.yaml
#
# Or using legacy command:
#   h2kvm --config 60-vsphere/vsphere-enable-cbt.yaml

command: vsphere
vcenter: vcenter.example.com
vc_user: administrator@vsphere.local
vc_password_env: VC_PASSWORD
vc_insecure: true
vs_action: enable_cbt
vm_name: myVM
json: true
