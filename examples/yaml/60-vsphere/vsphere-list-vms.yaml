# Run with primary command (recommended):
#   h2kvmctl --config 60-vsphere/vsphere-list-vms.yaml
#
# Or using legacy command:
#   h2kvm --config 60-vsphere/vsphere-list-vms.yaml

command: vsphere
vcenter: vcenter.example.com
vc_user: administrator@vsphere.local
vc_password_env: VC_PASSWORD
vc_insecure: true
dc_name: ha-datacenter
vs_action: list_vm_names
json: true
