# Run with primary command (recommended):
#   h2kvmctl --config 60-vsphere/vsphere-download-vm-disk.yaml
#
# Or using legacy command:
#   h2kvm --config 60-vsphere/vsphere-download-vm-disk.yaml

command: vsphere
vcenter: vcenter.example.com
vc_user: administrator@vsphere.local
vc_password_env: VC_PASSWORD
vc_insecure: true
vs_action: download_vm_disk
vm_name: myVM
disk: 0
local_path: ./downloads/myVM-disk0.vmdk
chunk_size: 1048576
json: true
