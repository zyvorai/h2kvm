# Run with primary command (recommended):
#   h2kvmctl --config 20-live-fix/live-fix-batch.yaml
#
# Or using legacy command:
#   hyper2kvm --config 20-live-fix/live-fix-batch.yaml

command: live-fix
print_fstab: true
fstab_mode: stabilize-all
verbose: 2
vms:
- host: vm1.example.com
  user: root
  sudo: true
  regen_initramfs: true
- host: vm2.example.com
  user: admin
  identity: ~/.ssh/key
  sudo: true
  remove_vmware_tools: false
