# ============================================
# Complete Workflow: vSphere → libvirt (openSUSE Leap 15.5)
# ============================================
# Description: Export openSUSE Leap VM from vSphere and prepare for libvirt/KVM
# Use Case: Enterprise SUSE migration
#
# Prerequisites:
#   - govc or ovftool installed
#   - pyvmomi: pip install pyvmomi
#   - qemu-img: zypper install qemu-tools
#   - libguestfs: zypper install libguestfs
#
# Environment variables:
#   export VC_PASSWORD='your-vcenter-password'
#
# Run:
#   sudo -E h2kvmctl --config examples/yaml/70-complete-workflows/vsphere-to-libvirt-opensuse-leap.yaml
# ============================================

cmd: vsphere

# vSphere Connection
vcenter: vcenter.example.com
vc_user: administrator@vsphere.local
vc_password_env: VC_PASSWORD
vc_insecure: true
dc_name: Production-DC

# VM Selection
vm_name: opensuse-leap-15-server

# vSphere Export
vs_action: export_vm
export_mode: ovf_export
vs_control_plane: govc
govc_url: "https://vcenter.example.com/sdk"
govc_password_env: VC_PASSWORD
govc_insecure: true
govc_datacenter: Production-DC
govc_export_remove_cdroms: true

# Snapshot before export
vs_create_snapshot: true
snapshot_name: pre-kvm-migration
snapshot_memory: false

# Disk Processing
flatten: true
to_output: opensuse-leap-15-server.qcow2
out_format: qcow2
compress: true
output_dir: /data/kvm

# Guest Fixes
regen_initramfs: true
fstab_mode: stabilize-all
remove_vmware_tools: true
initramfs_add_drivers: "virtio virtio_blk virtio_scsi virtio_net virtio_pci virtio_balloon"

# libvirt Domain XML
emit_domain_xml: true
uefi: true
ovmf_code: /usr/share/qemu/ovmf-x86_64-code.bin
ovmf_vars_template: /usr/share/qemu/ovmf-x86_64-vars.bin
memory: 4096
vcpus: 4
cpu_topology: "1:4:1"
machine: q35
disk_bus: virtio
disk_cache: none
disk_io: native
disk_discard: unmap
net_model: virtio
libvirt_network: bridge:br0
serial_console: true
graphics: vnc
graphics_listen: 127.0.0.1
guest_os: linux

# Validation
libvirt_test: true
timeout: 300

# Reporting
report: /var/log/migrations/opensuse-leap.md
enable_recovery: true
verbose: 1
