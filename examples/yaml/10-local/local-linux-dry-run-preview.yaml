# Run with primary command (recommended):
#   h2kvmctl --config 10-local/local-linux-dry-run-preview.yaml
#
# Or using legacy command:
#   h2kvm --config 10-local/local-linux-dry-run-preview.yaml

command: local
vmdk: /path/to/linux.vmdk
dry_run: true
print_fstab: true
fstab_mode: stabilize-all
regen_initramfs: false
flatten: false
verbose: 2
