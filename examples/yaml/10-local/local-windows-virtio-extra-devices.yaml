# Run with primary command (recommended):
#   h2kvmctl --config 10-local/local-windows-virtio-extra-devices.yaml
#
# Or using legacy command:
#   hyper2kvm --config 10-local/local-windows-virtio-extra-devices.yaml

command: local
vmdk: /path/to/windows.vmdk
# optional — auto-discovered at /var/lib/hyper2kvm/virtio-win.iso
virtio_drivers_dir: /path/to/virtio-win
enable_virtio_gpu: true
enable_virtio_input: true
enable_virtio_fs: true
to_output: windows-kvm-extra.qcow2
report: windows-virtio-extra.md
verbose: 2
