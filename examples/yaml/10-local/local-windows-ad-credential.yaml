# Windows Migration with Automated Domain Rejoin (Credential Method)
#
# This example shows credential-based domain rejoin automation.
# Requires: Service account credentials with domain join permissions
#
# WARNING: This method requires secure credential storage.
# For production use, integrate with HashiCorp Vault or Azure Key Vault.
#
# Run with:
#   h2kvmctl --config 10-local/local-windows-ad-credential.yaml

command: local
vmdk: /path/to/domain-joined-windows.vmdk
to_output: domain-joined-windows-kvm.qcow2
verbose: 2

windows:
  license:
    preserve: true
    reactivate: true

  active_directory:
    enabled: true

    rejoin:
      # Automated domain rejoin with credentials
      method: credential

      # Domain configuration
      domain: corp.example.com

      # Optional: Specify OU path for migrated computers
      ou_path: "OU=Migrated VMs,OU=Servers,DC=corp,DC=example,DC=com"

      # Credential source
      credential_source: vault

      # Vault path (HashiCorp Vault, AWS Secrets Manager, Azure Key Vault)
      vault_path: "secret/windows/domain-join"

      # Alternative: Store credentials in config (NOT RECOMMENDED for production)
      # credential_source: config
      # username: "CORP\\svc_migration"
      # password: "SecurePassword123!"  # Better: use environment variable

# Note: The credential-based method will:
# 1. Extract domain info from registry (domain, computer name, last DC)
# 2. Stage PowerShell rejoin script
# 3. Import encrypted credentials from credentials.xml (must be staged separately)
# 4. Execute Remove-Computer + Add-Computer on first boot
# 5. Schedule reboot to complete domain join
# 6. Clean up credentials.xml for security
#
# Security best practices:
# - Use least-privilege service account (domain join permission only)
# - Rotate credentials regularly
# - Use time-limited credentials (expire after migration window)
# - Enable audit logging for domain join operations
# - Store credentials in external vault, not in config files
