# Run with primary command (recommended):
#   h2kvmctl --cmd generate-systemd --config 50-daemon/generate-systemd.yaml
#
# Or using legacy command:
#   h2kvm --cmd generate-systemd --config 50-daemon/generate-systemd.yaml

output_dir: /var/lib/h2kvm/out
watch_dir: /var/lib/h2kvm/incoming
workdir: /var/lib/h2kvm/work
verbose: 1
log_file: /var/log/h2kvm.log
