# Run with primary command (recommended):
#   h2kvmctl --cmd generate-systemd --config 50-daemon/generate-systemd.yaml
#
# Or using legacy command:
#   hyper2kvm --cmd generate-systemd --config 50-daemon/generate-systemd.yaml

output_dir: /var/lib/hyper2kvm/out
