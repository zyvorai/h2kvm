apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: migrationjobs.h2kvm.io
spec:
  group: h2kvm.io
  names:
    kind: MigrationJob
    listKind: MigrationJobList
    plural: migrationjobs
    singular: migrationjob
    shortNames:
    - mj
    - mjob
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - operation
            - image
            properties:
              operation:
                type: string
                enum:
                - inspect
                - convert
                - offline_fix
                description: "Migration operation type"

              image:
                type: object
                required:
                - path
                - format
                properties:
                  path:
                    type: string
                    description: "Path to source VM disk image"
                  format:
                    type: string
                    enum:
                    - vmdk
                    - vdi
                    - vhd
                    - vhdx
                    - qcow2
                    description: "Source image format"
                  checksum:
                    type: string
                    description: "Expected SHA-256 checksum"

              parameters:
                type: object
                description: "Operation-specific parameters"
                x-kubernetes-preserve-unknown-fields: true

              artifacts:
                type: object
                properties:
                  output_path:
                    type: string
                    description: "Output directory path"
                  output_format:
                    type: string
                    enum:
                    - qcow2
                    - raw
                    default: qcow2
                  compress:
                    type: boolean
                    default: false

              priority:
                type: integer
                minimum: 0
                maximum: 100
                default: 50
                description: "Job priority (0-100, higher = more priority)"

              preemptionPolicy:
                type: string
                enum:
                - Never
                - Lower
                - SameOrLower
                - Always
                default: "Lower"
                description: "Preemption policy for this job"

              timeout:
                type: string
                pattern: '^[0-9]+(s|m|h)$'
                default: "2h"
                description: "Job timeout (e.g., 30m, 2h)"

              retryPolicy:
                type: object
                properties:
                  maxRetries:
                    type: integer
                    minimum: 0
                    maximum: 5
                    default: 2
                  backoff:
                    type: string
                    enum:
                    - exponential
                    - linear
                    - fixed
                    default: exponential

              workerSelector:
                type: object
                description: "Label selector for worker assignment"
                x-kubernetes-preserve-unknown-fields: true

              dependsOn:
                type: array
                description: "List of job names this job depends on"
                items:
                  type: string
                x-kubernetes-validations:
                - rule: "self.all(x, x != '')"
                  message: "Dependency names cannot be empty"

          status:
            type: object
            properties:
              state:
                type: string
                enum:
                - Created
                - Validated
                - Queued
                - Assigned
                - Running
                - Progressing
                - Completed
                - Failed
                - Cancelled
                - Retrying
                description: "Current job state"

              assignedWorker:
                type: string
                description: "Worker pod name handling this job"

              startTime:
                type: string
                format: date-time

              completionTime:
                type: string
                format: date-time

              progress:
                type: object
                properties:
                  percentage:
                    type: integer
                    minimum: 0
                    maximum: 100
                  currentPhase:
                    type: string
                  message:
                    type: string

              result:
                type: object
                properties:
                  success:
                    type: boolean
                  outputFiles:
                    type: array
                    items:
                      type: string
                  errorMessage:
                    type: string
                  artifacts:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true

              retries:
                type: integer
                description: "Number of retry attempts"

              nextRetryTime:
                type: string
                format: date-time
                description: "When the next retry will occur"

              preempted:
                type: object
                description: "Preemption information"
                properties:
                  preemptedBy:
                    type: string
                  preemptedAt:
                    type: string
                    format: date-time
                  reason:
                    type: string

              cost:
                type: object
                description: "Resource cost tracking"
                properties:
                  computeCost:
                    type: number
                    format: double
                  storageCost:
                    type: number
                    format: double
                  networkCost:
                    type: number
                    format: double
                  totalCost:
                    type: number
                    format: double

              sla:
                type: object
                description: "SLA compliance status"
                properties:
                  slaName:
                    type: string
                  compliant:
                    type: boolean
                  violations:
                    type: array
                    items:
                      type: string

              conditions:
                type: array
                items:
                  type: object
                  required:
                  - type
                  - status
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                      enum:
                      - "True"
                      - "False"
                      - "Unknown"
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                    message:
                      type: string

              dependencies:
                type: object
                description: "Dependency status tracking"
                properties:
                  total:
                    type: integer
                    description: "Total number of dependencies"
                  completed:
                    type: integer
                    description: "Number of completed dependencies"
                  failed:
                    type: integer
                    description: "Number of failed dependencies"
                  blocking:
                    type: array
                    description: "List of dependencies blocking execution"
                    items:
                      type: string

    subresources:
      status: {}

    additionalPrinterColumns:
    - name: Operation
      type: string
      jsonPath: .spec.operation
    - name: State
      type: string
      jsonPath: .status.state
    - name: Worker
      type: string
      jsonPath: .status.assignedWorker
    - name: Progress
      type: string
      jsonPath: .status.progress.percentage
      format: int32
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: h2kvm-operator
  namespace: h2kvm-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: h2kvm-operator
rules:
- apiGroups:
  - h2kvm.io
  resources:
  - migrationjobs
  - migrationjobs/status
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete

- apiGroups:
  - ""
  resources:
  - pods
  - pods/log
  verbs:
  - get
  - list
  - watch

- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: h2kvm-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: h2kvm-operator
subjects:
- kind: ServiceAccount
  name: h2kvm-operator
  namespace: h2kvm-system
