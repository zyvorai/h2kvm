apiVersion: scorecard.operatorframework.io/v1alpha3
kind: Configuration
metadata:
  name: config
stages:
  - parallel: true
    tests:
      - entrypoint:
          - scorecard-test
          - basic-check-spec
        image: quay.io/operator-framework/scorecard-test:v1.34.0
        labels:
          suite: basic
          test: basic-check-spec-test
        description: Validates that the operator bundle contains all required custom resource definitions
      - entrypoint:
          - scorecard-test
          - olm-bundle-validation
        image: quay.io/operator-framework/scorecard-test:v1.34.0
        labels:
          suite: olm
          test: olm-bundle-validation-test
        description: Validates the bundle contents
      - entrypoint:
          - scorecard-test
          - olm-crds-have-validation
        image: quay.io/operator-framework/scorecard-test:v1.34.0
        labels:
          suite: olm
          test: olm-crds-have-validation-test
        description: Validates that CRDs have validation
      - entrypoint:
          - scorecard-test
          - olm-crds-have-resources
        image: quay.io/operator-framework/scorecard-test:v1.34.0
        labels:
          suite: olm
          test: olm-crds-have-resources-test
        description: Validates that CRDs have resources listed
      - entrypoint:
          - scorecard-test
          - olm-spec-descriptors
        image: quay.io/operator-framework/scorecard-test:v1.34.0
        labels:
          suite: olm
          test: olm-spec-descriptors-test
        description: Validates that CRDs have spec descriptors
      - entrypoint:
          - scorecard-test
          - olm-status-descriptors
        image: quay.io/operator-framework/scorecard-test:v1.34.0
        labels:
          suite: olm
          test: olm-status-descriptors-test
        description: Validates that CRDs have status descriptors
